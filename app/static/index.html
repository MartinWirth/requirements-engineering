<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Requirements Engineering Workbench</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <div class="header-main"><strong>Requirements Engineering Workbench</strong><div class="header-selects"><label for="modelSelect">Model:</label><select id="modelSelect">
    <option>Requirements</option><option>User Stories</option><option>Use Cases</option><option>Actors</option><option>Traceability</option>
  </select><label for="tooltipMode">Tooltip type:</label><select id="tooltipMode" title="Tooltip type">
    <option value="full">Full + dependencies</option>
    <option value="api">API call</option>
    <option value="short">Short + IREB</option>
  </select></div>
</header>
<div class="layout">
<nav id="navigation">
  <div class="nav-title">Model</div>
  <button data-type="Requirements">Requirements</button>
  <button data-type="User Stories">User Stories</button>
  <button data-type="Use Cases">Use Cases</button>
  <button data-type="Actors">Actors</button>
  <button data-type="Traceability">Traceability</button>
</nav>
<main>
  <div class="toolbar">
    <h1 id="pageTitle">Requirements</h1>
    <input id="filter" placeholder="Filter…" autocomplete="off">
    <button id="newButton">New</button>
  </div>
  <div id="tableContainer"></div>
</main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
